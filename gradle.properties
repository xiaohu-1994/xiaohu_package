# Give the Gradle daemon enough heap for Paper builds.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m

# The host JAVA_HOME points at JDK 26, and even the locally installed JDK 25 is
# too new for Gradle 8.14.3's embedded Kotlin DSL compiler, which only parses JVM
# versions up to 24 (IllegalArgumentException: N at JavaVersion.parse). The Gradle
# DAEMON JVM and the Java TOOLCHAIN are independent: the daemon may run on a
# supported JVM while the toolchain still compiles our sources with JDK 25 (see
# build.gradle.kts `java.toolchain.languageVersion = 25`). We therefore run the
# daemon on the installed JDK 21 and keep the compile toolchain at 25.
org.gradle.java.home=C:/Program Files/Java/jdk-21
